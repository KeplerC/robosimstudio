# The gallery's manifest: one [[project]] per folder under gallery/, one [[entry]] per item.
# scripts/gallery.py writes gallery/README.md and each project's README.md from it, and --check holds them to it.
# Clips live on the Hugging Face Hub under gallery/<project>/<id>/media/ (see robosimstudio/hub.py).
#
# status: verified (ported, passes the harness on main: set code and verified_on) | partial (ported, task not
#         completed or a check fails: set code) | video (older code, not ported) | scene (no robot task filmed yet)
# media:  clip and still names under media/; the first is the one a card links to. poster.jpg is always there.

[[project]]
id = "robosimstudio-real2sim"
title = "Real to sim"
about = "Scenes rebuilt in RoboSimStudio by a coding agent from one stock photo, with a YAM doing a chore in each, and three scenes designed without a reference photo. A scene's code moves into this folder when it is ported to current main."

[[project]]
id = "abc130"
title = "ABC-130k twins"
about = "Twins of real teleoperated episodes from the [ABC-130k](https://huggingface.co/datasets/XDOF/ABC-130k) dataset (XDOF), built by a coding agent on the dataset's own YAM station and checked by a reviewer agent. Each clip is the simulation, replaying the recorded episode on the twin."

[[project]]
id = "vabar"
title = "VABAR"
about = "Tasks from the VABAR benchmark (Variational Automation Benchmark for Agentic Robotics): tool sorting, tool hanging, cable routing, gear meshing and USB-C insertion, filmed in September 2026 with the first policy that solved each one, or its best attempt when none did."

[[project]]
id = "rgbs"
title = "Bench tasks"
about = "Contact-rich bench tasks with deformable materials: wiping, polishing, tape and film peeling, cutting carton tape and threading a cable through a conduit. Ported to current main on the YAM, where the robot moves things only by finger contact, and re-filmed path traced in November 2026."

