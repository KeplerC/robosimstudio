id = "bar-wipe-with-sponge"
title = "Bar wiping with a foam sponge"
status = "partial"
code = "gallery/rgbs/tasks/rgbs"
robot = "YAM"
media = ["bar-wipe-with-sponge.mp4"]
source = "RoboSimStudio bench task"
links = []
licence = "Apache-2.0"
note = "A YAM arm picks a foam sponge up in its jaws and wipes a marker stripe off a grab bar while the other arm steadies the bar. Partial on current main: it cleans 0.71 of the stripe against the 0.95 gate. Held by the jaws' squeeze alone (the old task pinned the foam to the hand), the sponge creeps and turns in the jaws during a stroke; main's wipe-the-bar demo measures the same 0.69 to 0.76 without its latch."

